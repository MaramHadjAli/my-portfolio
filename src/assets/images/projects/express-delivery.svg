<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="ExpressDelivery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c1d"/>
      <stop offset="1" stop-color="#1e1050"/>
    </linearGradient>
    <radialGradient id="glow1" cx="40%" cy="35%" r="60%">
      <stop offset="0" stop-color="#6be3ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6be3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="60%">
      <stop offset="0" stop-color="#9c27b0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <g opacity="0.45" fill="#6be3ff">
    <circle cx="180" cy="100" r="1.8"/>
    <circle cx="310" cy="200" r="1.4"/>
    <circle cx="480" cy="130" r="1.6"/>
    <circle cx="950" cy="190" r="2"/>
    <circle cx="1060" cy="340" r="1.3"/>
    <circle cx="900" cy="530" r="1.5"/>
    <circle cx="640" cy="580" r="1.2"/>
    <circle cx="350" cy="540" r="1.7"/>
  </g>

  <!-- Truck icon -->
  <g transform="translate(900 120)" opacity="0.3">
    <rect x="0" y="20" width="80" height="50" rx="6" stroke="#6be3ff" stroke-width="2" fill="none"/>
    <rect x="80" y="35" width="40" height="35" rx="6" stroke="#6be3ff" stroke-width="2" fill="none"/>
    <circle cx="25" cy="75" r="10" stroke="#b388ff" stroke-width="2" fill="none"/>
    <circle cx="65" cy="75" r="10" stroke="#b388ff" stroke-width="2" fill="none"/>
    <circle cx="105" cy="75" r="10" stroke="#b388ff" stroke-width="2" fill="none"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="72" y="170" font-size="50" fill="#6be3ff" font-weight="800" letter-spacing="0.6">ExpressDelivery</text>
    <text x="72" y="230" font-size="20" fill="#c3b6ff">Real-time delivery management &amp; tracking</text>
    <text x="72" y="280" font-size="22" fill="#c3b6ff" opacity="0.8">Spring Boot • Android • WebSocket • JWT • MySQL</text>

    <g transform="translate(72 330)" fill="none">
      <rect x="0" y="0" width="520" height="240" rx="18" stroke="#6be3ff" stroke-opacity="0.55"/>

      <rect x="24" y="24" width="200" height="18" rx="9" fill="#6be3ff" fill-opacity="0.35"/>
      <rect x="24" y="60" width="420" height="12" rx="6" fill="#b388ff" fill-opacity="0.25"/>
      <rect x="24" y="84" width="380" height="12" rx="6" fill="#b388ff" fill-opacity="0.2"/>
      <rect x="24" y="108" width="340" height="12" rx="6" fill="#b388ff" fill-opacity="0.18"/>

      <rect x="24" y="148" width="130" height="32" rx="16" stroke="#9c27b0" stroke-opacity="0.7"/>
      <rect x="166" y="148" width="150" height="32" rx="16" stroke="#6be3ff" stroke-opacity="0.7"/>

      <rect x="24" y="200" width="280" height="12" rx="6" fill="#6be3ff" fill-opacity="0.14"/>
      <rect x="24" y="220" width="240" height="12" rx="6" fill="#6be3ff" fill-opacity="0.12"/>
    </g>
  </g>
</svg>
