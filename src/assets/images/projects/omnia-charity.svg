<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Omnia Charity Tracking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c1d"/>
      <stop offset="1" stop-color="#1e1050"/>
    </linearGradient>
    <radialGradient id="glow1" cx="55%" cy="38%" r="60%">
      <stop offset="0" stop-color="#9c27b0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="68%" r="60%">
      <stop offset="0" stop-color="#6be3ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6be3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <g opacity="0.5" fill="#6be3ff">
    <circle cx="200" cy="130" r="1.5"/>
    <circle cx="340" cy="230" r="1.8"/>
    <circle cx="500" cy="110" r="1.3"/>
    <circle cx="960" cy="200" r="1.6"/>
    <circle cx="1030" cy="360" r="1.4"/>
    <circle cx="870" cy="500" r="1.7"/>
    <circle cx="580" cy="570" r="1.2"/>
    <circle cx="380" cy="510" r="1.5"/>
  </g>

  <!-- Heart/charity icon -->
  <g transform="translate(920 110)" opacity="0.25" stroke="#b388ff" stroke-width="2.5" fill="none">
    <path d="M40 20 C40 8, 55 0, 65 10 C75 0, 90 8, 90 20 C90 40, 65 55, 65 55 C65 55, 40 40, 40 20Z"/>
    <circle cx="65" cy="75" r="20" stroke="#6be3ff" stroke-width="1.5"/>
    <path d="M55 75 L65 85 L80 68" stroke="#6be3ff" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="72" y="170" font-size="46" fill="#6be3ff" font-weight="800" letter-spacing="0.6">Omnia Charity Tracking</text>
    <text x="72" y="225" font-size="20" fill="#c3b6ff">Aid distribution, family tracking &amp; analytics platform</text>
    <text x="72" y="275" font-size="22" fill="#c3b6ff" opacity="0.8">NestJS • TypeScript • TypeORM • JWT • REST API</text>

    <g transform="translate(72 325)" fill="none">
      <rect x="0" y="0" width="520" height="240" rx="18" stroke="#6be3ff" stroke-opacity="0.55"/>

      <rect x="24" y="24" width="240" height="18" rx="9" fill="#6be3ff" fill-opacity="0.32"/>
      <rect x="24" y="62" width="400" height="12" rx="6" fill="#b388ff" fill-opacity="0.25"/>
      <rect x="24" y="86" width="360" height="12" rx="6" fill="#b388ff" fill-opacity="0.2"/>
      <rect x="24" y="110" width="320" height="12" rx="6" fill="#b388ff" fill-opacity="0.18"/>

      <rect x="24" y="150" width="140" height="32" rx="16" stroke="#ffffff" stroke-opacity="0.7"/>
      <rect x="176" y="150" width="160" height="32" rx="16" stroke="#6be3ff" stroke-opacity="0.7"/>

      <rect x="24" y="202" width="290" height="12" rx="6" fill="#6be3ff" fill-opacity="0.14"/>
      <rect x="24" y="222" width="250" height="12" rx="6" fill="#6be3ff" fill-opacity="0.12"/>
