<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Quantum Twin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c1d"/>
      <stop offset="1" stop-color="#1e1050"/>
    </linearGradient>
    <radialGradient id="glow1" cx="35%" cy="40%" r="60%">
      <stop offset="0" stop-color="#6be3ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6be3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="58%" r="60%">
      <stop offset="0" stop-color="#9c27b0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <g opacity="0.5" fill="#6be3ff">
    <circle cx="190" cy="140" r="1.7"/>
    <circle cx="290" cy="210" r="1.4"/>
    <circle cx="460" cy="100" r="1.6"/>
    <circle cx="970" cy="180" r="1.9"/>
    <circle cx="1050" cy="330" r="1.2"/>
    <circle cx="890" cy="520" r="1.5"/>
    <circle cx="610" cy="560" r="1.3"/>
    <circle cx="370" cy="530" r="1.6"/>
  </g>

  <!-- IoT/network icon -->
  <g transform="translate(900 100)" opacity="0.25">
    <circle cx="50" cy="40" r="12" stroke="#6be3ff" stroke-width="2" fill="none"/>
    <circle cx="15" cy="80" r="8" stroke="#b388ff" stroke-width="1.5" fill="none"/>
    <circle cx="85" cy="80" r="8" stroke="#b388ff" stroke-width="1.5" fill="none"/>
    <circle cx="30" cy="15" r="6" stroke="#b388ff" stroke-width="1.5" fill="none"/>
    <circle cx="75" cy="10" r="6" stroke="#b388ff" stroke-width="1.5" fill="none"/>
    <line x1="42" y1="50" x2="22" y2="73" stroke="#6be3ff" stroke-width="1" opacity="0.6"/>
    <line x1="58" y1="50" x2="78" y2="73" stroke="#6be3ff" stroke-width="1" opacity="0.6"/>
    <line x1="42" y1="30" x2="34" y2="20" stroke="#6be3ff" stroke-width="1" opacity="0.6"/>
    <line x1="58" y1="30" x2="70" y2="15" stroke="#6be3ff" stroke-width="1" opacity="0.6"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="72" y="175" font-size="52" fill="#6be3ff" font-weight="800" letter-spacing="0.6">Quantum Twin</text>
    <text x="72" y="230" font-size="20" fill="#c3b6ff">IoT digital twin with real-time dashboard &amp; TCP/WebSocket bridge</text>
    <text x="72" y="280" font-size="22" fill="#c3b6ff" opacity="0.8">C • Python • Node.js • WebSocket • HTML/CSS/JS</text>

    <g transform="translate(72 325)" fill="none">
      <rect x="0" y="0" width="520" height="240" rx="18" stroke="#6be3ff" stroke-opacity="0.55"/>

      <rect x="24" y="24" width="230" height="18" rx="9" fill="#6be3ff" fill-opacity="0.34"/>
      <rect x="24" y="62" width="410" height="12" rx="6" fill="#b388ff" fill-opacity="0.25"/>
      <rect x="24" y="86" width="370" height="12" rx="6" fill="#b388ff" fill-opacity="0.2"/>
      <rect x="24" y="110" width="330" height="12" rx="6" fill="#b388ff" fill-opacity="0.18"/>

      <rect x="24" y="150" width="120" height="32" rx="16" stroke="#9c27b0" stroke-opacity="0.7"/>
      <rect x="156" y="150" width="150" height="32" rx="16" stroke="#6be3ff" stroke-opacity="0.7"/>

      <rect x="24" y="200" width="300" height="12" rx="6" fill="#6be3ff" fill-opacity="0.14"/>
      <rect x="24" y="222" width="260" height="12" rx="6" fill="#6be3ff" fill-opacity="0.12"/>
